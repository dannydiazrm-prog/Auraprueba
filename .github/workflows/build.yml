name: Compilar APK e Instalador Windows

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
      - name: Generar google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      
      - name: Compilar Windows Release
        run: flutter build windows --release
      
      - name: Instalar NSIS
        run: choco install nsis -y
        
      - name: Crear Instalador con NSIS
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer.nsi'
        
      - uses: actions/upload-artifact@v4
        with:
          name: AuraEstandar-Instalador-Windows
          path: AuraEstandar_Instalador.exe
