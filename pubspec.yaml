name: aura_estandar
description: Aura Estándar
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  pdf: ^3.10.8
  printing: ^5.12.0
  fl_chart: ^0.68.0
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  flutter_colorpicker: ^1.1.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/IMG-20260228-WA0018.jpg
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
  image_path: "assets/logo.png"
